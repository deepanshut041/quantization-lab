[project]
name = "quantization-semantic-search"
version = "0.1.0"
description = "Semantic Search With a Compressed Index: runnable setup and future quantization workflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
compressed-semantic-search = "compressed_semantic_search:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/.gitignore", "/.ai-project.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
